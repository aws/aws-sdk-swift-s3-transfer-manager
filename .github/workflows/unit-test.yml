name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  apple:
      runs-on: ${{ matrix.runner }}
      strategy:
        fail-fast: false
        matrix:
          # This matrix runs unit tests on iOS sim & Mac, on oldest & newest supported Xcode.
          runner:
            - macos-14
            - macos-26
          xcode:
            - Xcode_15.2
            - Xcode_26.4
          destination:
            - 'platform=iOS Simulator,OS=17.2,name=iPhone 15'
            - 'platform=iOS Simulator,OS=26.4.1,name=iPhone 17'
            - 'platform=tvOS Simulator,OS=17.2,name=Apple TV 4K (3rd generation) (at 1080p)'
            - 'platform=tvOS Simulator,OS=26.4,name=Apple TV 4K (3rd generation) (at 1080p)'
            - 'platform=visionOS Simulator,OS=1.0,name=Apple Vision Pro'
            - 'platform=visionOS Simulator,OS=26.4.1,name=Apple Vision Pro'
            - 'platform=macOS'
          exclude:
            # Don't run old macOS with new Xcode
            - runner: macos-14
              xcode: Xcode_26.4
            # Don't run new macOS with old Xcode
            - runner: macos-26
              xcode: Xcode_15.2
            # Don't run old simulators with new Xcode
            - destination: 'platform=tvOS Simulator,OS=17.2,name=Apple TV 4K (3rd generation) (at 1080p)'
              xcode: Xcode_26.4
            - destination: 'platform=iOS Simulator,OS=17.2,name=iPhone 15'
              xcode: Xcode_26.4
            - destination: 'platform=visionOS Simulator,OS=1.0,name=Apple Vision Pro'
              xcode: Xcode_26.4
            # Don't run new simulators with old Xcode
            - destination: 'platform=tvOS Simulator,OS=26.4,name=Apple TV 4K (3rd generation) (at 1080p)'
              xcode: Xcode_15.2
            - destination: 'platform=iOS Simulator,OS=26.4.1,name=iPhone 17'
              xcode: Xcode_15.2
            - destination: 'platform=visionOS Simulator,OS=26.4.1,name=Apple Vision Pro'
              xcode: Xcode_15.2
      steps:
        - name: Configure Xcode
          run: sudo xcode-select -s /Applications/${{ matrix.xcode }}.app
        - name: Install visionOS sim if needed
          if: ${{ contains(matrix.destination, 'platform=visionOS') }}
          run: |
            sudo xcodebuild -runFirstLaunch
            sudo xcrun simctl list
            sudo xcodebuild -downloadPlatform visionOS
            sudo xcodebuild -runFirstLaunch
        - name: Checkout aws-sdk-swift-s3-transfer-manager
          uses: actions/checkout@v4
          with:
            path: aws-sdk-swift-s3-transfer-manager
        - name: Cache Swift
          uses: actions/cache@v4
          with:
            path: |
              ~/Library/Caches/org.swift.swiftpm
              ~/.cache/org.swift.swiftpm
            key: 1-${{ runner.os }}-${{ matrix.xcode }}-${{ hashFiles('Package.swift') }}
            restore-keys: |
              1-${{ runner.os }}-${{ matrix.xcode }}-${{ hashFiles('Package.swift') }}
              1-${{ runner.os }}-${{ matrix.xcode }}-
        - name: Trust Swift package plugins
          run: |
            # Non-interactive CI must opt in to build-tool plugins (e.g. smithy-swift's
            # SmithyCodeGeneratorPlugin); otherwise xcodebuild fails with
            # "Plugin ... must be enabled before it can be used" before any test runs.
            defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
            defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
        - name: Resolve Package Dependencies
          run: |
            cd aws-sdk-swift-s3-transfer-manager
            xcodebuild -resolvePackageDependencies
        - name: List Available Schemes
          run: |
            cd aws-sdk-swift-s3-transfer-manager
            xcodebuild -list
        - name: Build and Run Unit Tests
          run: |
            cd aws-sdk-swift-s3-transfer-manager
            rm -rf UnitTests.xcresult
            set -o pipefail && \
            NSUnbufferedIO=YES xcodebuild \
              -scheme aws-sdk-swift-s3-transfer-manager \
              -destination '${{ matrix.destination }}' \
              -only-testing:S3TransferManagerUnitTests \
              -resultBundlePath UnitTests.xcresult \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              test 2>&1 \
              | xcbeautify
        - name: Surface test failures
          if: ${{ failure() }}
          run: |
            cd aws-sdk-swift-s3-transfer-manager
            if [ ! -d UnitTests.xcresult ]; then
              echo "No result bundle produced (failure occurred before tests ran, e.g. dependency resolution or build)."
              exit 0
            fi
            echo "::group::Failing test assertions (test-results summary)"
            xcrun xcresulttool get test-results summary --path UnitTests.xcresult 2>/dev/null || true
            echo "::endgroup::"
            echo "::group::Failure messages (raw)"
            # Works across Xcode versions: dump JSON and print any failure/assertion messages.
            xcrun xcresulttool get --legacy --path UnitTests.xcresult --format json 2>/dev/null \
              | grep -oE '"(message|testStatus|identifier)"[^,}]*' | sort -u \
              || xcrun xcresulttool get --path UnitTests.xcresult --format json 2>/dev/null | head -c 20000
            echo "::endgroup::"
        - name: Upload xcresult bundle
          if: ${{ failure() }}
          uses: actions/upload-artifact@v4
          with:
            name: UnitTests-${{ matrix.runner }}-${{ matrix.xcode }}-${{ strategy.job-index }}.xcresult
            path: aws-sdk-swift-s3-transfer-manager/UnitTests.xcresult
            if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    container: swift:${{ matrix.version }}-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: jammy
            version: "5.9"
          - os: noble
            version: "6.3"
    steps:
      - name: Checkout aws-sdk-swift-s3-transfer-manager
        uses: actions/checkout@v4
        with:
          path: aws-sdk-swift-s3-transfer-manager
      - name: Cache Swift
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: 1-${{ runner.os }}-swift-${{ matrix.version }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            1-${{ runner.os }}-swift-${{ matrix.version }}-spm-${{ hashFiles('Package.swift') }}
            1-${{ runner.os }}-swift-${{ matrix.version }}-spm-
      - name: Install OpenSSL
        run: apt-get update && apt-get install -y libssl-dev
      - name: Print Package.swift
        run: |
          cd aws-sdk-swift-s3-transfer-manager
          cat Package.swift
      - name: Build and Run Unit Tests
        run: |
          cd aws-sdk-swift-s3-transfer-manager
          swift test --filter S3TransferManagerUnitTests
